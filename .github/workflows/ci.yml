name: NOVA CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test type-strips .ts files imported by the test suite
          # (message-threads.ts), which needs Node >= 23.6.
          node-version: 24
      - run: npm test
      - run: node scripts/check-release.mjs
      - run: npm run pack:check
